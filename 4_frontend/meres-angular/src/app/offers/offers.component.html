<div class="container mt-4">
    <h2>Ajánlataink</h2>
    <table mat-table [dataSource]="offers" class="mat-elevation-z8">
      <ng-container matColumnDef="id  id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let offer">{{ offer.id }}</td>
      </ng-container>
      <ng-container matColumnDef="kategoriaNev">
        <th mat-header-cell *matHeaderCellDef>Kategória</th>
        <td mat-cell *matCellDef="let offer">{{ offer.kategoriaNev }}</td>
      </ng-container>
      <ng-container matColumnDef="leiras">
        <th mat-header-cell *matHeaderCellDef>Leírás</th>
        <td mat-cell *matCellDef="let offer">{{ offer.leiras }}</td>
      </ng-container>
      <ng-container matColumnDef="hirdetesDatuma">
        <th mat-header-cell *matHeaderCellDef>Hirdetés dátuma</th>
        <td mat-cell *matCellDef="let offer">{{ offer.hirdetesDatuma }}</td>
      </ng-container>
      <ng-container matColumnDef="tehermentes">
        <th mat-header-cell *matHeaderCellDef>Tehermentes</th>
        <td mat-cell *matCellDef="let offer">{{ offer.tehermentes ? 'Igen' : 'Nem' }}</td>
      </ng-container>
      <ng-container matColumnDef="kepUrl">
        <th mat-header-cell *matHeaderCellDef>Kép</th>
        <td mat-cell *matCellDef="let offer"><img [src]="offer.kepUrl" style="max-width: 100px;"></td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
